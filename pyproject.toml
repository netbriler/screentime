[project]
name = "screentime-tracker"
version = "3.0.0"
description = "Send Apple Screen Time from your Mac (and the iPhone/iPad synced to it) to your own server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
screentime = "screentime.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screentime = ["py.typed"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 119
# Vendored upstream code stays byte-identical, see THIRD_PARTY_NOTICES.md.
extend-exclude = ["src/screentime/_vendor"]
